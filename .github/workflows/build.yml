name: QuestLyrics Build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "include/**"
      - "qpm.json"
      - ".github/workflows/build.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build p7zip-full

      - name: Test lyrics parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            src/lyrics/LrcParser.cpp \
            tests/lrc_parser_test.cpp \
            -o parser_test
          ./parser_test

      - name: Get Quest mod build template
        run: |
          git clone --depth 1 \
            https://github.com/Lauriethefish/quest-mod-template.git \
            /tmp/quest-mod-template

          cp /tmp/quest-mod-template/template/CMakeLists.txt \
            ./CMakeLists.txt

          cp -R /tmp/quest-mod-template/template/cmake ./cmake

          sed -i 's/#{id}/questlyrics/g' CMakeLists.txt

      - name: Set up Android NDK
        run: |
          wget \
            https://github.com/QuestPackageManager/ndk-canary-archive/releases/download/27.0.1/android-ndk-10883340-linux-x86_64.zip \
            -O "$HOME/ndk.zip"

          unzip -q -o "$HOME/ndk.zip" -d "$HOME/"

          echo "$HOME/android-ndk-r27-canary" \
            > ndkpath.txt

          test -f "$HOME/android-ndk-r27-canary/build/cmake/android.toolchain.cmake"

      - name: Set up QPM and restore dependencies
        uses: Fernthedev/qpm-action@main
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          cache: true
          publish: false

      - name: Compile native Quest library
        run: |
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -B build

          cmake --build build --parallel 2

      - name: Create QMOD package
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          libraries = list(Path("build").rglob("libquestlyrics.so"))

          if not libraries:
              raise SystemExit("Build failed: libquestlyrics.so was not produced")

          library = libraries[0]

          manifest = {
              "$schema": "https://raw.githubusercontent.com/Lauriethefish/QuestPatcher.QMod/main/QuestPatcher.QMod/Resources/qmod.schema.json",
              "_QPVersion": "0.1.1",
              "name": "QuestLyrics",
              "id": "questlyrics",
              "modloader": "Scotland2",
              "author": "SpaceASLZ",
              "version": "0.1.0",
              "packageId": "com.beatgames.beatsaber",
              "packageVersion": "1.40.8_7379",
              "description": "Timed lyrics overlay for Beat Saber on Quest.",
              "dependencies": [
                  {
                      "version": "^6.4.2",
                      "id": "beatsaber-hook",
                      "downloadIfMissing": "https://github.com/QuestPackageManager/beatsaber-hook/releases/download/v6.4.2/beatsaber-hook.qmod"
                  }
              ],
              "modFiles": [],
              "lateModFiles": ["libquestlyrics.so"],
              "libraryFiles": [],
              "fileCopies": [],
              "copyExtensions": []
          }

          with zipfile.ZipFile(
              "QuestLyrics.qmod",
              "w",
              compression=zipfile.ZIP_DEFLATED
          ) as package:
              package.writestr(
                  "mod.json",
                  json.dumps(manifest, indent=2) + "\n"
              )
              package.write(library, "libquestlyrics.so")

          print("Created QuestLyrics.qmod")
          PY

      - name: Upload QuestLyrics package
        uses: actions/upload-artifact@v4
        with:
          name: QuestLyrics-qmod
          path: QuestLyrics.qmod
          if-no-files-found: error
