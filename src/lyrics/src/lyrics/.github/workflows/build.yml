name: QuestLyrics Build

on:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          test -f README.md
          test -f src/lyrics/LrcParser.hpp
          test -f src/lyrics/LrcParser.cpp
          echo "QuestLyrics source files found."
